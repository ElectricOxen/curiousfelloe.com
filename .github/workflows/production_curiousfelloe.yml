name: Build and deploy Python app to Azure Web App - curiousfelloe

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv antenv
          source antenv/bin/activate

      - name: Generate token for private dependencies
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUILD_APP_ID }}
          private-key: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
          owner: ElectricOxen
          repositories: eo-site-framework

      - name: Configure git for private dependencies
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout framework source for contract checks
        uses: actions/checkout@v4
        with:
          repository: ElectricOxen/eo-site-framework
          ref: production
          token: ${{ steps.app-token.outputs.token }}
          path: _eo_framework

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enforce platform contract
        run: python manage.py platform_check --strict
        env:
          PYTHONPATH: ${{ github.workspace }}/_eo_framework/src
          APP_NAME: curiousfelloe
          DJANGO_SECRET_KEY: build-only-not-a-real-key
          LOCAL_MODE: "True"
          DEBUG_MODE: "False"
          DEFAULT_FROM_EMAIL: hello@curiousfelloe.com
          NOTIFY_EMAIL: hello@curiousfelloe.com

      - name: Vendor private framework wheel for Azure deploy
        run: |
          mkdir -p wheels
          pip download eo-site-framework --no-deps --no-index --find-links "$(pip cache dir)" -d ./wheels/ 2>/dev/null \
            || pip wheel "$(grep eo-site-framework requirements.txt)" --no-deps --wheel-dir ./wheels/
          WHEEL_NAME=$(basename ./wheels/eo_site_framework-*.whl)
          sed -i "s|^eo-site-framework.*|./wheels/${WHEEL_NAME}|" requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: |
          python manage.py tailwind_sources -o static/css/_eo_sources.css
          npx @tailwindcss/cli -i static/css/input.css -o static/css/tailwind.css --minify
        env:
          APP_NAME: curiousfelloe
          DJANGO_SECRET_KEY: build-only-not-a-real-key
          LOCAL_MODE: "True"
          DEBUG_MODE: "False"
          DEFAULT_FROM_EMAIL: hello@curiousfelloe.com
          NOTIFY_EMAIL: hello@curiousfelloe.com

      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          APP_NAME: curiousfelloe
          DJANGO_SECRET_KEY: build-only-not-a-real-key
          LOCAL_MODE: "False"
          DEBUG_MODE: "False"
          DEFAULT_FROM_EMAIL: hello@curiousfelloe.com
          NOTIFY_EMAIL: hello@curiousfelloe.com
          DBNAME: unused
          DBUSER: unused
          DBPASS: unused
          DBHOST: localhost
          DBPORT: "5432"

      - name: Zip artifact for deployment
        run: |
          zip release.zip ./* -r \
            -x ".git/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v6
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        run: |
          az webapp deploy \
            --resource-group electricoxen-io \
            --name curiousfelloe \
            --src-path release.zip \
            --type zip \
            --clean true \
            --restart true

      - name: Ensure SSL Certificate
        run: |
          SSL_STATE=$(az webapp show \
            --name curiousfelloe \
            --resource-group electricoxen-io \
            --query "hostNameSslStates[?name=='curiousfelloe.com'].sslState" \
            -o tsv 2>/dev/null)

          if [ "$SSL_STATE" != "SniEnabled" ] && [ -n "$SSL_STATE" ]; then
            echo "::warning::SSL not bound — restoring managed certificate..."

            THUMBPRINT=$(az webapp config ssl create \
              --name curiousfelloe \
              --resource-group electricoxen-io \
              --hostname curiousfelloe.com \
              --query thumbprint -o tsv)

            az webapp config ssl bind \
              --name curiousfelloe \
              --resource-group electricoxen-io \
              --certificate-thumbprint "$THUMBPRINT" \
              --ssl-type SNI

            echo "✅ SSL certificate restored (thumbprint: $THUMBPRINT)"
          else
            echo "✅ SSL OK"
          fi
