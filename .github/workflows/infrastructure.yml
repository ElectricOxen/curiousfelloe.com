# ============================================================================
# Infrastructure Deployment — curiousfelloe.com
#
# Deploys site-specific Azure resources (web app, database, app settings,
# KV secrets, custom domain) against the shared platform.
# Triggered by changes to infra/ on the production branch.
# ============================================================================

name: Infrastructure

on:
  push:
    branches: [production]
    paths: ['infra/**']
  pull_request:
    branches: [production]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: electricoxen-io
  APP_NAME: curiousfelloe
  DOMAIN_NAME: curiousfelloe.com

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Preview Infrastructure Changes
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If Preview
        env:
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          DBPASS: ${{ secrets.DBPASS }}
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

  deploy:
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: bicep
        env:
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          DBPASS: ${{ secrets.DBPASS }}
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      # ── Post-deploy hardening ─────────────────────────────────────
      # These steps use idempotent CLI commands and run even if
      # Bicep fails (e.g., on RoleAssignmentExists or a transient
      # ARM error) so SSL + RBAC are always enforced.

      - name: Ensure RBAC (Key Vault Secrets User)
        if: always()
        run: |
          PRINCIPAL_ID=$(az webapp identity show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query principalId -o tsv 2>/dev/null)

          if [ -z "$PRINCIPAL_ID" ]; then
            echo "::warning::Web app identity not found — skipping RBAC"
            exit 0
          fi

          KV_ID=$(az keyvault show \
            --name electricoxen-kv \
            --query id -o tsv)

          az role assignment create \
            --role "Key Vault Secrets User" \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --scope "$KV_ID" \
            2>/dev/null || true

          echo "✅ RBAC enforced (principal: $PRINCIPAL_ID)"

      - name: Bind custom domains (apex + www)
        if: always()
        run: |
          for HOST in ${{ env.DOMAIN_NAME }} www.${{ env.DOMAIN_NAME }}; do
            az webapp config hostname add \
              --webapp-name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --hostname "$HOST" 2>/dev/null || true
            echo "✅ Hostname ensured: $HOST"
          done

      - name: Ensure SSL certificates (apex + www)
        if: always()
        run: |
          bind_ssl() {
            local HOST=$1
            SSL_STATE=$(az webapp show \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "hostNameSslStates[?name=='$HOST'].sslState" \
              -o tsv 2>/dev/null)

            if [ "$SSL_STATE" = "SniEnabled" ]; then
              echo "✅ SSL already bound: $HOST"
              return 0
            fi

            echo "Creating managed certificate for $HOST..."
            az webapp config ssl create \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --hostname "$HOST" 2>/dev/null || true

            # Poll until cert is ready (max ~5 min)
            for i in $(seq 1 30); do
              THUMBPRINT=$(az webapp config ssl show \
                -g ${{ env.RESOURCE_GROUP }} \
                --certificate-name "$HOST" \
                --query thumbprint -o tsv 2>/dev/null || echo "")
              [ -n "$THUMBPRINT" ] && break
              echo "  waiting for cert... ($i/30)"
              sleep 10
            done

            if [ -z "$THUMBPRINT" ]; then
              echo "::warning::Cert not ready for $HOST — skipping bind"
              return 0
            fi

            az webapp config ssl bind \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --certificate-thumbprint "$THUMBPRINT" \
              --ssl-type SNI 2>/dev/null || true
            echo "✅ SSL bound: $HOST (thumbprint: $THUMBPRINT)"
          }

          bind_ssl ${{ env.DOMAIN_NAME }}
          bind_ssl www.${{ env.DOMAIN_NAME }}
