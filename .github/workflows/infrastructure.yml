# ============================================================================
# Infrastructure Deployment — curiousfelloe.com
#
# Deploys site-specific Azure resources (web app, database, app settings,
# KV secrets, custom domain) against the shared platform.
# Triggered by changes to infra/ on the production branch.
# ============================================================================

name: Infrastructure

on:
  push:
    branches: [production]
    paths: ['infra/**']
  pull_request:
    branches: [production]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: electricoxen-io
  APP_NAME: curiousfelloe
  DOMAIN_NAME: curiousfelloe.com

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Preview Infrastructure Changes
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If Preview
        env:
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          DBPASS: ${{ secrets.DBPASS }}
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

  deploy:
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        env:
          CF_DJANGO_SECRET_KEY: ${{ secrets.CF_DJANGO_SECRET_KEY }}
          DBPASS: ${{ secrets.DBPASS }}
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: Ensure SSL Certificate
        run: |
          # Check if cert is already bound
          SSL_STATE=$(az webapp show \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "hostNameSslStates[?name=='${{ env.DOMAIN_NAME }}'].sslState" \
            -o tsv)

          if [ "$SSL_STATE" != "SniEnabled" ]; then
            echo "::warning::SSL not bound — creating managed certificate..."

            THUMBPRINT=$(az webapp config ssl create \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --hostname ${{ env.DOMAIN_NAME }} \
              --query thumbprint -o tsv)

            az webapp config ssl bind \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --certificate-thumbprint "$THUMBPRINT" \
              --ssl-type SNI

            echo "✅ SSL certificate bound (thumbprint: $THUMBPRINT)"
          else
            echo "✅ SSL already bound"
          fi
